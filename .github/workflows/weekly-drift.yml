name: Weekly astrology drift check

# ─────────────────────────────────────────────────────────────────────────────
# Every Monday ~03:00 IST (Sunday 21:30 UTC), and on demand:
#   (a) runs the golden-chart suite + the Drik Panchang / festival suites on the code on `main`;
#   (b) sends the same 20 golden births + 7 AstroSage couples to the LIVE production API
#       (bornclock.com /api/kundali, /api/sade-sati, /api/kundali-match) and to the code on main,
#       and compares every answer with the stored reference
#       (src/lib/vedic/__tests__/golden/goldenCharts.json — Swiss Ephemeris + AstroSage values).
# On any mismatch it opens (or updates) the GitHub issue "Astrology drift detected" with a table
# of differences, and the run is marked failed. AstroSage / Drik are NEVER fetched live — the
# stored golden values are the reference. Read-only: no deploy, no database access.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '30 21 * * 0'   # Sunday 21:30 UTC = Monday 03:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: (a) Golden + Panchang/festival reference suites on main
        id: suite
        continue-on-error: true
        run: >-
          npx vitest run
          src/lib/vedic/__tests__/goldenCharts.test.ts
          src/lib/vedic/__tests__/ayanamsaDrik.test.ts
          src/lib/vedic/__tests__/festivals.test.ts
          src/lib/vedic/__tests__/panchang.test.ts
          src/lib/vedic/__tests__/panchangDay.test.ts
          src/lib/vedic/__tests__/sadeSatiEphemeris.test.ts
          src/lib/vedic/__tests__/matchmakingAstroSage.test.ts

      - name: (b) Compare main + LIVE bornclock.com API with the golden reference
        id: drift
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VITEST_FAILED: ${{ steps.suite.outcome == 'failure' && '1' || '0' }}
        run: npx tsx scripts/golden/driftCheck.ts --source=both --base=https://bornclock.com --out=drift-report.md --json=drift-report.json

      - name: Job summary
        if: always()
        run: |
          if [ -f drift-report.md ]; then cat drift-report.md >> "$GITHUB_STEP_SUMMARY"; else echo "Drift script produced no report (see log)." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: |
            drift-report.md
            drift-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Open / update the "Astrology drift detected" issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUITE: ${{ steps.suite.outcome }}
          DRIFT: ${{ steps.drift.outcome }}
          TITLE: Astrology drift detected
        run: |
          set -euo pipefail
          [ -f drift-report.md ] || printf '## Astrology drift detected\n\nThe drift script did not produce a report — see %s\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > drift-report.md
          existing=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
                      --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "$SUITE" = "success" ] && [ "$DRIFT" = "success" ]; then
            echo "No drift."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Weekly check $(date -u +%F): no drift — all golden charts and AstroSage couples match on main and on live. Close this issue once the fix is confirmed."
            fi
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file drift-report.md
            gh issue comment "$existing" --body "Still drifting on $(date -u +%F) — issue body updated with the latest table."
          else
            gh issue create --title "$TITLE" --body-file drift-report.md
          fi

      - name: Fail the run when drift was found
        if: steps.suite.outcome == 'failure' || steps.drift.outcome == 'failure'
        run: |
          echo "::error::Astrology drift detected — see the job summary and the GitHub issue."
          exit 1
