name: Deploy & Nightly Automation

on:
  push:
    branches: [main]
  schedule:
    # 02:30 UTC daily — nightly bio fill + redeploy.
    - cron: '30 2 * * *'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Nightly bio fill (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/auto-bio-fill.ts --limit 50

      - name: Export unified celebrities
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/export-celebrities.ts

      - name: Build
        run: npm run build

      - name: Commit refreshed data (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "bornclock-bot"
          git config user.email "bot@bornclock.com"
          git add src/data/celebrity-bios.json src/data/celebrities.json || true
          git commit -m "chore(auto): nightly bio + celebrity refresh" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
