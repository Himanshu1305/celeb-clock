name: Deploy & Nightly Automation

# ─────────────────────────────────────────────────────────────────────────────
# Part AP — SAFE RELEASE PIPELINE
#
# Triggers and what they do:
#   • push to `main`          → PRODUCTION deploy (bornclock worker). Only main.
#   • workflow_dispatch       → PRODUCTION deploy ONLY if the `deploy_production`
#                               input is exactly "deploy-production". A blank
#                               manual run does nothing (safe no-deploy).
#   • schedule (02:30 UTC)    → NIGHTLY: refresh data on `develop` and deploy the
#                               STAGING worker only (`--env staging`). It can
#                               NEVER touch production.
#
# IMPORTANT: scheduled workflows always run the workflow FILE from the default
# branch (`main`). So this nightly only takes effect after the launch merge into
# `main`. The Cloudflare API token must be added to GitHub ONLY after that merge
# (until then the nightly fails harmlessly at the deploy step instead of pushing
# September `main` code to production).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  schedule:
    # 02:30 UTC daily — nightly bio fill + staging redeploy from develop.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Type "deploy-production" to deploy the PRODUCTION worker. Leave blank for a safe no-deploy run.'
        required: false
        default: ''

# Needed so the nightly job can push the refreshed data commit back to develop.
# (The old workflow lacked this, so `git push` 403'd and the failure was hidden
#  by `|| echo "push skipped"`. Both are fixed below.)
permissions:
  contents: write

jobs:
  # ── NIGHTLY: data refresh on develop + STAGING deploy only ──────────────────
  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (src + api + functions + vite config; any error stops the staging deploy)
        # `npx tsc --noEmit -p .` used to check zero files (tsconfig.json had `"files": []`).
        # tsconfig.json now includes src/, api/ and functions/, so this is a real check.
        run: npm run typecheck

      - name: Unit + golden-chart tests (any failure stops the staging deploy)
        # Includes the golden astrology reference suite (src/lib/vedic/__tests__/goldenCharts.test.ts:
        # 20 births + 7 AstroSage couples vs Swiss Ephemeris / AstroSage) and the Drik Panchang /
        # festival suites. No production secrets are passed on purpose: tests must never read or
        # write the live database (scripts/__tests__/Task2.test.ts skips itself without them).
        run: npx vitest run

      - name: Nightly bio fill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/auto-bio-fill.ts --limit 50

      - name: Export unified celebrities
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/export-celebrities.ts

      - name: Build
        run: npm run build

      - name: Commit refreshed data to develop (fails loudly if push is rejected)
        run: |
          git config user.name "bornclock-bot"
          git config user.email "bot@bornclock.com"
          git add src/data/celebrity-bios.json src/data/celebrities.json
          # Only the "nothing changed" case is tolerated; a real push failure must
          # fail the job (no more `|| echo "push skipped"` hiding 403s).
          if git commit -m "chore(auto): nightly bio + celebrity refresh"; then
            git push origin HEAD:develop
          else
            echo "No data changes to commit."
          fi

      - name: Deploy to Cloudflare STAGING (never production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --env staging

  # ── PRODUCTION: push to main, or explicit confirmed manual dispatch ─────────
  # 2026-10-23: split into build → 4 parallel prerender shards → deploy. A single
  # runner needed ~65 min to prerender all ~5,700 pages and hit the time cap, so
  # ~100 pages (including the homepage) went live as the bare SPA shell. Shards
  # finish in ~15-20 min each, and the deploy job refuses to ship if coverage
  # drops below 98% or the homepage is missing (scripts/prerender-merge.mjs).
  prod-build:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.deploy_production == 'deploy-production')
    runs-on: ubuntu-latest
    # 30 → 45 min (Oct 2026): the test step (~6 min) now runs before the build.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (src + api + functions + vite config; any error stops the production deploy)
        # `npx tsc --noEmit -p .` used to check zero files (tsconfig.json had `"files": []`).
        # tsconfig.json now includes src/, api/ and functions/, so this is a real check.
        run: npm run typecheck

      - name: Unit + golden-chart tests (any failure stops the production deploy)
        # Includes the golden astrology reference suite (src/lib/vedic/__tests__/goldenCharts.test.ts:
        # 20 births + 7 AstroSage couples vs Swiss Ephemeris / AstroSage) and the Drik Panchang /
        # festival suites. No production secrets are passed on purpose: tests must never read or
        # write the live database (scripts/__tests__/Task2.test.ts skips itself without them).
        run: npx vitest run

      - name: Export unified celebrities
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/export-celebrities.ts

      - name: Build app (no prerender)
        run: npm run build:app

      # Batch 7: export-celebrities may add retired celebrity slugs to
      # src/data/celebritySlugRedirects.json. The deploy job bundles the Worker
      # (functions/_worker.ts → duplicateRedirects) from a fresh checkout, so it must get
      # this build's map, or a new duplicate would be dropped from the site but not 301'd.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: prod-build
          path: |
            dist
            scripts/celebrity-meta.json
            src/data/celebrities.json
            src/data/celebritySlugRedirects.json
          include-hidden-files: true
          retention-days: 3

  prod-prerender:
    needs: prod-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: prod-build
          path: .

      - name: Prerender shard ${{ matrix.shard }} of 4
        env:
          PRERENDER_SHARD: ${{ matrix.shard }}/4
          PRERENDER_OUT: prerender-out
          PRERENDER_TIME_LIMIT_MIN: '45'
        run: node scripts/prerender.mjs

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: prerender-shard-${{ matrix.shard }}
          path: prerender-out
          if-no-files-found: error
          retention-days: 3

  production:
    needs: [prod-build, prod-prerender]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: prod-build
          path: .

      - name: Download prerender shards
        uses: actions/download-artifact@v4
        with:
          pattern: prerender-shard-*
          path: prerender-shards

      - name: Merge shards + check SEO coverage (blocks deploy if too low)
        run: node scripts/prerender-merge.mjs prerender-shards

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Deploy to Cloudflare PRODUCTION
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
