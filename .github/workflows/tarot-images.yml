# One-off helper (batch 8): fetch public-domain Rider–Waite–Smith card scans from Wikimedia
# Commons on a runner (the dev sandbox can't reach Commons) and commit them to this branch.
# Runs only on pushes to b8-tarot-images; it never touches main and never deploys.
name: tarot-images
on:
  push:
    branches: [b8-tarot-images]
    paths: [scripts/fetch-tarot-images.mjs, .github/workflows/tarot-images.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp@0.33.5
      - run: node scripts/fetch-tarot-images.mjs
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tarot src/data/tarotCards/images.json
          git commit -m "tarot: public-domain RWS 1909 card images from Wikimedia Commons (licence checked per file)" || echo "nothing to commit"
          git push
