name: Performance Budget

# ─────────────────────────────────────────────────────────────────────────────
# PR-ONLY performance budget gate (Part AP / FINAL step 2).
#
# This workflow NEVER deploys and has NO Cloudflare credentials. It only builds
# the app, serves the local `dist/` with `vite preview`, measures LCP / CLS / TBT
# on one page per layout, and fails the check if any page exceeds the budget in
# scripts/perf-budget.json. It runs on pull requests (and manual dispatch) so a
# regression is caught in review — it can never touch staging or production.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Read-only: no deploy, no write to the repo.
permissions:
  contents: read

jobs:
  perf-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (dev mode — no secrets, no prerender data needed)
        run: npm run build:dev

      - name: Run performance budget
        run: node scripts/perf-budget.mjs
        env:
          RUNS: 5
          PREVIEW: 1
