<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>You're offline — BornClock</title>
  <style>
    html,body{margin:0;height:100%;background:#0E2238;color:#F5EAD2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
    img{height:48px;width:auto;margin-bottom:24px}
    h1{font-size:22px;margin:0 0 8px}
    p{font-size:15px;line-height:1.6;color:#C9D4DE;max-width:360px;margin:0 0 20px}
    a{display:inline-block;background:#B8862F;color:#0E2238;text-decoration:none;font-weight:700;font-size:14px;padding:11px 20px;border-radius:10px}
    .tag{margin-top:28px;font-size:12px;font-style:italic;color:#8A9BA8}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/bornclock-logo.png" alt="BornClock" />
    <h1>You're offline</h1>
    <p>BornClock needs a connection to calculate your chart. Check your network and try again — your saved details stay on your device.</p>
    <a href="/" onclick="location.reload();return false;">Try again</a>
    <div class="tag">Know your time. Live it well.</div>
  </div>
</body>
</html>
