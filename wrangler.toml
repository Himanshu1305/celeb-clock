name = "bornclock"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
main = "functions/_worker.ts"
workers_dev = true

routes = [
  { pattern = "staging.bornclock.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[triggers]
crons = [
  "0 6 * * *",    # daily email (existing)
  "10 6 * * *",   # ops monitor — daily 06:10 UTC
  "0 7 * * 1",    # integrity emphasis — Mon 07:00 UTC
  "0 9 * * 0",    # ops digest — Sun 09:00 UTC
]

# Secrets added via CF dashboard — do not add secret values here
# process.env works via nodejs_compat shim for all simple string reads
