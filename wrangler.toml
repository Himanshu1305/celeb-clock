name = "bornclock"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
main = "functions/_worker.ts"
workers_dev = true

# ⚠️ IMPORTANT (verified 2026-09-22): although only staging.bornclock.com is listed here,
# the PRODUCTION domain bornclock.com is ALSO attached to this same `bornclock` worker via
# the Cloudflare dashboard. Therefore `wrangler deploy` publishes to BOTH staging AND
# production at once. For a production-SAFE preview, use `npx wrangler versions upload`
# (creates a preview URL without promoting to live); use `wrangler versions deploy`/
# `wrangler rollback` to change what is live. Do NOT assume `wrangler deploy` is staging-only.
routes = [
  { pattern = "staging.bornclock.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Part AD (SEO): run the Worker BEFORE the static-asset router so functions/_worker.ts can
# intercept requests to prerendered pages — needed to (a) upgrade the asset layer's
# trailing-slash 307 to a 301, and (b) 301 homepage query-param duplicate URLs. Without
# this, the asset router short-circuits those paths (307 / 200) before the Worker runs.
run_worker_first = true

[triggers]
crons = [
  "0 6 * * *",    # daily email (existing)
  "10 6 * * *",   # ops monitor — daily 06:10 UTC
  "0 7 * * 1",    # integrity emphasis — Mon 07:00 UTC
  "0 9 * * 0",    # ops digest — Sun 09:00 UTC
]

# Secrets added via CF dashboard — do not add secret values here
# process.env works via nodejs_compat shim for all simple string reads

# ── Part AO: separate STAGING worker ─────────────────────────────────────────────
# A SEPARATE Cloudflare Worker (`bornclock-staging`) on its own *.workers.dev address.
# It shares the same Supabase database but has NO custom domain and NO routes, so it can
# never serve or affect production. A named [env.staging] block INHERITS routes/custom
# domains, scheduled triggers and workers_dev from the top level and does NOT inherit vars
# or bindings — so every one of those is set EXPLICITLY below.
#   • routes = []                → no custom domain, cannot capture production traffic
#   • triggers.crons = []        → no scheduled jobs run on staging
#   • workers_dev = true         → reachable only at bornclock-staging.<subdomain>.workers.dev
#   • assets + vars redeclared   → not inherited; must be restated
# Deploy with:  npm run deploy:staging   (never `wrangler deploy`, which hits production).
# Verify first: npx wrangler deploy --env staging --dry-run
[env.staging]
name = "bornclock-staging"
workers_dev = true
routes = []

[env.staging.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[env.staging.triggers]
crons = []

[env.staging.vars]
# Staging-only flags. Production has NO [vars] block, so these exist on staging alone and
# cannot change production behaviour. The worker suppresses outbound email on staging except
# to the allowlist, so automated tests never email real users.
BORNCLOCK_ENV = "staging"
SUPPRESS_OUTBOUND_EMAIL = "true"
EMAIL_ALLOWLIST = "hello@bornclock.com"

